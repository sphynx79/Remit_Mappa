# config/application.yml
defaults: &defaults
  mapbox:
    url: 'https://api.mapbox.com'
    # il token NON va committato: si legge dalla variabile d'ambiente (setx MAPBOX_API_TOKEN "...")
    api_token: <%= ENV.fetch('MAPBOX_API_TOKEN') %>

development:
  <<: *defaults
  database:
    adress:
      - '127.0.0.1:27030'
    name: 'Ampere'

test:
  <<: *defaults

