plugins: rubocop-performance

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'
    - '.rblcl/**/*'
    - '.git/**/*'
    - '.vscode/**/*'
  TargetRubyVersion: 4.0

Layout/LineLength:
  Max: 130

Style/NumericLiterals:
  MinDigits: 15

Layout/SpaceBeforeBlockBraces:
  EnforcedStyle: space

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Layout/SpaceInsideReferenceBrackets:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 50

Metrics/BlockLength:
  Max: 50

Metrics/ClassLength:
  Max: 150

Style/AsciiComments:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Layout/EndOfLine:
  Enabled: false
