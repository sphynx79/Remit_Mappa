# mise.toml di Remit_Mappa — runtime del progetto (mappa REMIT: server Roda + client Mithril).
#
# Definisce i runtime usati in sviluppo:
# - ruby 4.0.1: backend Roda/Puma in server/ (bundle install, rspec, rubocop)
# - node lts:   build e dev server del client in client/ (webpack, eslint)
# - python:     script di supporto occasionali

[tools]
python = "3.13"
node = "lts"
ruby = "4.0.1"

# I task girano in bash invece che nel `cmd /c` di default. Con cmd, il Ctrl-C
# su un task in foreground fa comparire la richiesta "Terminare il processo
# batch (S/N)?": il processo si ferma ma cmd resta in attesa di una risposta e
# il terminale diventa inutilizzabile. Con bash il Ctrl-C arriva pulito.
[settings]
windows_default_inline_shell_args = "bash -c"

# Percorsi della macchina: i valori qui sotto sono solo i default di questo host.
# Si sovrascrivono da fuori, senza toccare questo file, con una variabile
# d'ambiente oppure con un `mise.local.toml` personale (ha la precedenza).
[env]
MONGOD_EXE = "{{ env.MONGOD_EXE | default(value='C:/Appl/Mongodb/bin/mongod.exe') }}"
MONGO_EXE = "{{ env.MONGO_EXE | default(value='C:/Appl/Mongodb/bin/mongo.exe') }}"
MONGODB_AMPERE_PATH = "{{ env.MONGODB_AMPERE_PATH | default(value='E:/Sviluppo/Ampere/DB/mongodata') }}"
MONGODB_AMPERE_DEVELOPMENT_PATH = "{{ env.MONGODB_AMPERE_DEVELOPMENT_PATH | default(value='E:/Sviluppo/Ampere/DB_test/data') }}"

# ---------------------------------------------------------------------------
# Task di progetto: `mise tasks` per l'elenco, `mise run <task>` per eseguirli
# ---------------------------------------------------------------------------

[tasks.bundle-prod]
description = "Build di produzione del client e copia in server/public"
dir = "client"
run = ["npm run build", "ruby ../script/copia_public.rb"]

# Puma gira in FOREGROUND con i log a video: il Ctrl-C lo ferma e restituisce
# il prompt (vedi la nota su [settings] in testa al file). Per l'avvio detached
# resta `bash script/avvia_server.sh dev|prod`
[tasks.server-dev]
description = "Avvia l'API server di sviluppo su :9292 (foreground, log a video)"
dir = "server"
raw = true
run = "bundle exec puma --port 9292"

[tasks.server-prod]
description = "Avvia lo stack di produzione, Puma SSL + Caddy (foreground, log a video)"
dir = "server"
raw = true
run = "bundle exec puma -C config/puma_prod.rb"

[tasks.server-stop]
description = "Ferma Puma (dev/prod) e Caddy"
run = "bash script/ferma_server.sh"

[tasks.client-dev]
description = "Webpack dev server con hot reload su :9001 (foreground: chiudere col task client-stop o chiudendo il pannello)"
dir = "client"
raw = true
run = "npm run start"

[tasks.test]
description = "Suite RSpec del server (richiede il mongod di test attivo su :27030)"
dir = "server"
run = "bundle exec rspec"

[tasks.coverage]
description = "Suite RSpec con report coverage (soglia minima 88%, report in server/coverage)"
dir = "server"
env = { RUN_COVERAGE_REPORT = "1" }
run = "bundle exec rspec"

[tasks.lint-server]
description = "RuboCop sul server"
dir = "server"
run = "bundle exec rubocop"

[tasks.lint-client]
description = "ESLint sul client"
dir = "client"
run = "npx eslint src"

[tasks.lint]
description = "Lint completo (rubocop + eslint)"
depends = ["lint-server", "lint-client"]

# I due mongod girano in FOREGROUND con i log a video (nessun --logpath):
# si fermano con Ctrl-C, che per mongod è un arresto pulito
[tasks.db-test]
description = "Avvia il MongoDB di test su :27030 (snapshot locale, mai il DB di produzione)"
raw = true
run = "{{ env.MONGOD_EXE }} --config server/config/mongod.yaml --dbpath {{ env.MONGODB_AMPERE_DEVELOPMENT_PATH }} --port 27030 --bind_ip 127.0.0.1 --nojournal"

[tasks.db-test-stop]
description = "Arresto pulito del MongoDB di test (DB senza journal: mai kill brusco)"
run = '{{ env.MONGO_EXE }} --port 27030 admin --eval "db.shutdownServer()"'

# NB: bind anche su 127.0.0.1 oltre all'hostname: senza, MongoDB rifiuta lo
# shutdownServer remoto e l'arresto pulito sarebbe impossibile
[tasks.db-prod]
description = "Avvia il MongoDB di PRODUZIONE su :27018 (journal attivo)"
raw = true
run = "{{ env.MONGOD_EXE }} --config server/config/mongod.yaml --dbpath {{ env.MONGODB_AMPERE_PATH }} --port 27018 --bind_ip ENWS27719997,127.0.0.1"

[tasks.db-prod-stop]
description = "Arresto pulito del MongoDB di produzione"
run = '{{ env.MONGO_EXE }} --port 27018 admin --eval "db.shutdownServer()"'
