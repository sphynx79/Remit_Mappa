# mise.toml del plugin trinity — runtime del SERVIZIO Hindsight (server MCP :8888).
#
# Questo file NON è caricato automaticamente da Claude Code né da mise nei progetti:
# viene usato esplicitamente dagli hook del plugin via `mise -C <plugin_root> run <task>`
# (vedi hooks/hindsight/hindsight-ensure-up.sh). Hindsight è un singleton di macchina:
# l'env qui sotto serve SOLO al processo server al momento del lancio, i progetti
# parlano con il server già configurato via HTTP.
#
# La dashboard log (Roda/Puma), i benchmark (embed-bench/rerank-bench) e i check
# aggiornamenti (api-check/cp-check, in scheduler/) sono stati migrati
# qui dal repo Trinity. I task relativi sono in fondo a questo file.

[tools]
python = "3.13"
# Node nativo Windows: serve per il Control Plane di Hindsight (app Next.js avviata
# via `npx @vectorize-io/hindsight-control-plane`). NB: l'npx del Node MSYS2 UCRT64
# (/ucrt64/bin) crasha (segfault/bad_weak_ptr) — questo Node mise lo rimpiazza.
node = "lts"
# Ruby per la dashboard log (Roda/Puma): `bundle install` e `puma` girano con questo
# Ruby gestito da mise, NON quello MSYS2 (le gem vanno installate con lo stesso Ruby
# che le esegue). L'hook reshim richiede `mise` nel PATH — garantito da _.path in [env].
ruby = "4.0.1"
